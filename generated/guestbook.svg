<clipPath id="g0"><rect x="58" y="132" height="22" width="0"><animate attributeName="width" from="0" to="410" begin="0.50s" dur="1.18s" fill="freeze"/></rect></clipPath><clipPath id="g1"><rect x="58" y="164" height="22" width="0"><animate attributeName="width" from="0" to="764" begin="1.93s" dur="0.08s" fill="freeze"/></rect></clipPath><clipPath id="g2"><rect x="58" y="196" height="22" width="0"><animate attributeName="width" from="0" to="511" begin="2.12s" dur="0.08s" fill="freeze"/></rect></clipPath></defs><rect width="1200" height="338" rx="8" fill="#061633"/><rect width="1200" height="338" rx="8" fill="url(#g1)"/><rect width="1200" height="338" rx="8" fill="url(#g2)"/><rect x="12" y="12" width="1176" height="314" fill="none" stroke="#eaf2ff" stroke-width="1.8"/><rect x="18" y="18" width="1164" height="302" fill="none" stroke="#eaf2ff" stroke-opacity=".35"/><path d="M24 30H36M30 24V36" stroke="#7fb3ff" stroke-opacity=".6"/><path d="M1164 30H1176M1170 24V36" stroke="#7fb3ff" stroke-opacity=".6"/><path d="M24 308H36M30 302V314" stroke="#7fb3ff" stroke-opacity=".6"/><path d="M1164 308H1176M1170 302V314" stroke="#7fb3ff" stroke-opacity=".6"/><text x="40" y="54" fill="#7fb3ff" font-size="13" letter-spacing="3">FIG. 10 — GUESTBOOK</text><text x="1160" y="54" fill="#ffb000" font-size="13" text-anchor="end">SIGNED BY 0 DEVELOPERS</text><text x="40" y="276" fill="#eaf2ff" font-size="12.5">HOW IT WORKS  <tspan fill="#7fb3ff">click </tspan><tspan fill="#39ff14">SIGN THE GUESTBOOK</tspan><tspan fill="#7fb3ff"> below → GitHub opens a pre-filled issue → press Submit.</tspan></text><text x="40" y="298" fill="#7fb3ff" font-size="12.5">A GitHub Action reads it, adds your name + message to this log, replies to thank you and closes the issue — about a minute, end to end.</text><g><rect x="40" y="90" width="1120" height="152" rx="10" fill="#020b08" stroke="#39ff14" stroke-opacity=".45"/><rect x="40" y="90" width="1120" height="28" rx="10" fill="#0c1a12"/><rect x="40" y="108" width="1120" height="10" fill="#0c1a12"/><circle cx="58" cy="104" r="5" fill="#ff5f56"/><circle cx="76" cy="104" r="5" fill="#ffbd2e"/><circle cx="94" cy="104" r="5" fill="#27c93f"/><text x="600.0" y="108" fill="#5b7a5b" font-size="11" text-anchor="middle">guestbook.log</text></g><g filter="url(#glow)"><text x="60" y="146" font-size="14" clip-path="url(#g0)" xml:space="preserve"><tspan fill="#39ff14">akshat@ahmedabad</tspan><tspan fill="#d7ffd7">:~$ </tspan><tspan fill="#ffffff">cat guestbook.log | tail -8</tspan></text><text x="60" y="178" font-size="14" clip-path="url(#g1)" xml:space="preserve"><tspan fill="#6f9f7f">#      </tspan><tspan fill="#6f9f7f">VISITOR                 </tspan><tspan fill="#6f9f7f">MESSAGE                                             </tspan><tspan fill="#6f9f7f">SIGNED</tspan></text><text x="60" y="210" font-size="14" clip-path="url(#g2)" xml:space="preserve"><tspan fill="#ffb000">guestbook.log is empty — </tspan><tspan fill="#ffffff">be the first developer to sign it.</tspan></text><rect x="60" y="230" width="8" height="14" fill="#39ff14" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.5;.51" dur="1s" begin="2.33s" repeatCount="indefinite"/></rect></g><clipPath id="gc"><rect x="40" y="90" width="1120" height="152" rx="10"/></clipPath><g clip-path="url(#gc)"><rect x="40" y="118" width="1120" height="152" fill="url(#scan)"/><rect x="40" y="90" width="1120" height="50" fill="#39ff14" opacity=".035"><animate attributeName="y" from="40" to="242" dur="6s" repeatCount="indefinite"/></rect></g></svg>