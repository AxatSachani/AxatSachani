<svg xmlns="http://www.w3.org/2000/svg" width="590" height="350" viewBox="0 0 590 350" style="font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,'Liberation Mono',monospace"><defs>
<pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eaf2ff" stroke-opacity=".06"/></pattern>
<pattern id="g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#eaf2ff" stroke-opacity=".14"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#eaf2ff" stroke-width="1.4"/></marker>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
</defs><rect width="590" height="350" rx="8" fill="#061633"/><rect width="590" height="350" rx="8" fill="url(#g1)"/><rect width="590" height="350" rx="8" fill="url(#g2)"/><rect x="12" y="12" width="566" height="326" fill="none" stroke="#eaf2ff" stroke-width="1.8"/><rect x="18" y="18" width="554" height="314" fill="none" stroke="#eaf2ff" stroke-opacity=".35"/><path d="M24 30H36M30 24V36" stroke="#7fb3ff" stroke-opacity=".6"/><path d="M554 30H566M560 24V36" stroke="#7fb3ff" stroke-opacity=".6"/><path d="M24 320H36M30 314V326" stroke="#7fb3ff" stroke-opacity=".6"/><path d="M554 320H566M560 314V326" stroke="#7fb3ff" stroke-opacity=".6"/><rect x="36" y="40" width="76" height="76" rx="16" fill="#0a2a5c" stroke="#eaf2ff" stroke-opacity=".5"/><g><g><line x1="93.2" y1="78.0" x2="102.2" y2="78.0" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="87.6" y1="91.6" x2="93.9" y2="97.9" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="74.0" y1="97.2" x2="74.0" y2="106.2" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="60.4" y1="91.6" x2="54.1" y2="97.9" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="54.8" y1="78.0" x2="45.8" y2="78.0" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="60.4" y1="64.4" x2="54.1" y2="58.1" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="74.0" y1="58.8" x2="74.0" y2="49.8" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><line x1="87.6" y1="64.4" x2="93.9" y2="58.1" stroke="#ffb000" stroke-width="2.5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0 74.0 78.0" to="360 74.0 78.0" dur="16s" repeatCount="indefinite"/></g><circle cx="74.0" cy="78.0" r="12.8" fill="#ffb000" fill-opacity=".9"/></g><text x="132" y="74" fill="#eaf2ff" font-size="27" font-weight="800" style="font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">SolarRadar</text><rect x="134" y="90" width="84" height="19" rx="9.5" fill="#ffb000" fill-opacity="0.12" stroke="#ffb000" stroke-opacity=".7"/><text x="142" y="104" fill="#ffb000" font-size="10" letter-spacing=".6">OPEN SOURCE</text><circle cx="460" cy="56" r="5" fill="#ffb000"/><circle cx="460" cy="56" r="5" fill="none" stroke="#ffb000" stroke-width="2"><animate attributeName="r" values="5;15" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/></circle><text x="474" y="61" fill="#ffb000" font-size="13" font-weight="700" letter-spacing="1.5">BUILDING</text><text x="36" y="152" fill="#eaf2ff" font-size="15" font-weight="600" style="font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Live space-weather &amp; aurora forecasts.</text><text x="36" y="178" fill="#7fb3ff" font-size="12">An open-source dashboard for real-time solar activity and aurora</text><text x="36" y="196" fill="#7fb3ff" font-size="12">forecasts powered by NOAA data, with per-city aurora alerts.</text><rect x="36" y="250" width="84" height="19" rx="9.5" fill="#eaf2ff" fill-opacity="0.05" stroke="#eaf2ff" stroke-opacity=".7"/><text x="44" y="264" fill="#eaf2ff" font-size="10" letter-spacing=".6">Open source</text><rect x="128" y="250" width="72" height="19" rx="9.5" fill="#eaf2ff" fill-opacity="0.05" stroke="#eaf2ff" stroke-opacity=".7"/><text x="136" y="264" fill="#eaf2ff" font-size="10" letter-spacing=".6">NOAA data</text><rect x="208" y="250" width="72" height="19" rx="9.5" fill="#eaf2ff" fill-opacity="0.05" stroke="#eaf2ff" stroke-opacity=".7"/><text x="216" y="264" fill="#eaf2ff" font-size="10" letter-spacing=".6">Real-time</text><clipPath id="tape"><rect x="36" y="284" width="518" height="22"/></clipPath><pattern id="hz" width="28" height="22" patternUnits="userSpaceOnUse"><rect width="28" height="22" fill="#111"/><path d="M0 22 L14 0 H28 L14 22Z" fill="#ffb000"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 0" dur="1.2s" repeatCount="indefinite"/></pattern><g clip-path="url(#tape)"><rect x="36" y="284" width="518" height="22" fill="url(#hz)"/><rect x="175.0" y="286" width="240" height="18" fill="#111"/><text x="295.0" y="299" fill="#ffb000" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">UNDER CONSTRUCTION</text></g><text x="36" y="324" fill="#7fb3ff" font-size="10.5">being built in the open · public release coming soon</text></svg>